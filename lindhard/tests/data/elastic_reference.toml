sigma_tr1_a02 = 1.391754E-1
sigma_tr1_cite = "NIST SRD 64 v5.0, https://srdata.nist.gov/srd64/Transport1, element C (Z=6), E = 1000 eV, \"Transport Cross Section\" (Eq. (14) sigma_tr1) as displayed, a0^2; accessed 2026-10-20"

