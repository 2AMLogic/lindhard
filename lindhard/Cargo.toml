[package]
name = "lindhard"
description = "Clean-room Monte Carlo transport of ions and electrons in matter: implantation ranges, damage, sputtering and electron energy deposition"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
include = [
    "/src/**",
    # The manifest declares a harness-less `validation` test and five benches,
    # so their sources must ship or the packaged manifest has dangling targets.
    "/tests/**",
    "/benches/**",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
keywords = ["ion-implantation", "monte-carlo", "bca", "stopping-power", "physics"]
categories = ["science", "simulation"]

[dependencies]
rand_chacha = "0.10.0"
rand_core = "0.10.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.6"

# Level-1 validation harness (docs/validation.md): its own main, so it can
# print one summary table and exit non-zero when a check fails.
[[test]]
name = "validation"
path = "tests/validation/main.rs"
harness = false

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false }
serde_json = "1.0.151"

[[bench]]
name = "scattering"
harness = false

[[bench]]
name = "stopping"
harness = false

[[bench]]
name = "history"
harness = false

[[bench]]
name = "elastic"
harness = false

[[bench]]
name = "penn"
harness = false
