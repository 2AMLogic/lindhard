[dependencies]
rand_chacha = "0.10.0"
rand_core = "0.10.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.151"
toml = "1.1.6"
