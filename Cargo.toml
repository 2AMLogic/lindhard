[workspace]
resolver = "2"
members = ["lindhard", "lindhard-cli", "lindhard-py"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/2AMLogic/lindhard"
rust-version = "1.85"

[workspace.dependencies]
# The library, as the CLI depends on it. `path` is what the workspace builds
# against; `version` is what `cargo publish` writes into the packaged CLI
# manifest. Bump together with `workspace.package.version`.
lindhard = { path = "lindhard", version = "0.0.1" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[workspace.lints.rust]
# `deny`, not `forbid`: a `forbid` cannot be narrowed, and the allocation-count
# test (lindhard/tests/alloc.rs) must implement `GlobalAlloc`, which is unsafe.
# The library keeps its own crate-level `#![forbid(unsafe_code)]`.
unsafe_code = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
