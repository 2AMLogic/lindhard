<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" font-family="sans-serif" font-size="14">
<title>Lab frame, wafer cut and beam angles: tilt, twist and wafer rotation</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="720" height="540" fill="white"/>
<polygon points="82.5,292.3 412.5,292.3 577.5,87.7 247.5,87.7" fill="#dde8f5" stroke="#5a7fa8"/>
<text x="82.5" y="312.3" fill="#3b5f85">wafer surface (hkl), x = 0</text>
<line x1="330.0" y1="190.0" x2="330.0" y2="415.0" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<text x="338.0" y="419.0" fill="black" text-anchor="start">+x (depth): n, normal of (hkl)</text>
<line x1="330.0" y1="190.0" x2="555.0" y2="190.0" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<text x="561.0" y="195.0" fill="black" text-anchor="start">+y</text>
<line x1="330.0" y1="190.0" x2="442.5" y2="50.5" stroke="black" stroke-width="2" marker-end="url(#a)"/>
<text x="448.5" y="50.5" fill="black" text-anchor="start">+z</text>
<line x1="330.0" y1="190.0" x2="539.6" y2="135.4" stroke="#2a8a3a" stroke-width="2" marker-end="url(#a)"/>
<text x="545.6" y="149.4" fill="#2a8a3a" text-anchor="start">r = [uvw] (reference)</text>
<polyline points="420.0,190.0 420.9,188.9 421.8,187.7 422.6,186.6 423.4,185.5 424.1,184.3 424.8,183.2 425.5,182.1 426.1,181.0 426.7,179.8 427.2,178.7 427.7,177.6 428.2,176.5 428.6,175.4 429.0,174.3 429.4,173.2 429.7,172.1 429.9,171.1 430.1,170.0 430.3,168.9 430.5,167.9 430.6,166.9 430.6,165.8 430.6,164.8 430.6,163.8" fill="none" stroke="#2a8a3a" stroke-width="1.5"/>
