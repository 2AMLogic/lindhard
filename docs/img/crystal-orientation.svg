<polyline points="465.0,190.0 468.3,185.6 471.3,181.3 473.9,176.9 476.1,172.6 477.9,168.3 479.3,164.1 480.2,160.0 480.8,156.0 480.9,152.0 480.7,148.2 480.0,144.4 478.9,140.8 477.4,137.3 475.5,134.0 473.2,130.8 470.5,127.8 467.4,125.0 464.0,122.3 460.1,119.8 456.0,117.5 451.4,115.4 446.6,113.5 441.4,111.9 435.9,110.4" fill="none" stroke="#8e44ad" stroke-width="1.5"/>
