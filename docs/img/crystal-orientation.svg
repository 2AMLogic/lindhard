<text x="20" y="462" font-size="13">Lab frame: +x into the target, (y, z) lateral. The wafer is cut on (hkl); its inward normal n is +x.</text>
<text x="20" y="481" font-size="13">Reference r = [uvw] lies in the surface; at wafer rotation ω = 0 it is +y, and ω turns it towards +z.</text>
<text x="20" y="500" font-size="13">Beam: d = (cos θ, sin θ cos φ, sin θ sin φ) in the lab; in the crystal</text>
<text x="20" y="519" font-size="13">d = cos θ n + sin θ cos(φ − ω) r + sin θ sin(φ − ω) (n × r).</text>
</svg>
