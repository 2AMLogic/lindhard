# Backscatter coefficient eta of bulk carbon at normal incidence (#148): the
# committed input of the level-3 eta comparison (docs/validation.md,
# "Backscatter coefficient"). validation/experiments/backscatter.py runs it at
# each comparison energy (it changes only electron.beam.energy_ev and
# run.histories, and for the sensitivity runs the two elastic corrections);
# as written it is the 10 keV run and can be run by hand:
#
#   lindhard run validation/experiments/backscatter/eta_c.toml --out out/eta_c
#
# eta is results.yields.backscatter_eta of electron_summary.json: electrons
# leaving the front face with at least 50 eV, per primary.
#
# Model, and what it is not (docs/validation.md lists the gaps):
# - Elastic: Mott cross sections from radial-Dirac partial waves on the
#   Thomas-Fermi Yukawa STAND-IN potential (the DHFS table is a gap), with the
#   Furness-McCarthy exchange and the correlation-polarization corrections on.
# - Inelastic: the single-pole Penn algorithm on the measured optical ELF of
#   Hagemann, Gudat and Kunz (1975). Full Penn is the issue's model but builds
#   its tables far too slowly for this sweep; no separate inner-shell channel
#   (the transport loop has none yet; the optical ELF includes the shells).
# - No secondaries and a transparent surface: no band parameters of C are
#   committed. With a 50 eV cutoff no electron that could count towards eta
#   is dropped, but fast secondaries (above 50 eV) are not generated.

[electron.beam]
energy_ev = 10000.0
tilt_deg = 0.0

[electron.transport]
cutoff_ev = 50.0
cutoff_reference = "band-bottom"
escape_rule = "both-faces"
secondaries = "off"
boundary = "transparent"

[electron.elastic]
model = "mott"
potential = "thomas-fermi-yukawa"
exchange = true

[electron.elastic.correlation_polarization]
# Seltzer's cutoff rule needs every table energy above 50 eV, hence the
# 51 eV grid start below.
polarizability.C = { bohr3 = 11.3, source = "P. Schwerdtfeger and J. K. Nagle, Mol. Phys. 117, 1200 (2019), doi:10.1080/00268976.2018.1535143, 2018 Table of Static Dipole Polarizabilities, Table 1, Z = 6 C, recommended 11.3 +- 0.2 a.u." }

[electron.inelastic]
model = "penn-single-pole"

[electron.tables]
min_energy_ev = 51.0
points_per_decade = 20.0

[electron.materials.glassy_C]
optical_elf = "../../data/optical/c_elf_hagemann1975.toml"

# Glassy carbon at 1.5 g/cm3: the optical constants of Hagemann et al. are
# given "on the basis of rho = 1.5 g cm^-3" (DESY report SR-74/7, p. 20), so
# the target uses the same density to keep the elastic (per atom) and the
# inelastic (per volume, from the ELF) mean free paths consistent. The
# element table's 2.267 g/cm3 is graphite.
[materials.glassy_C]
density_g_cm3 = 1.5
elements = [{ symbol = "C", atom_fraction = 1.0 }]

[target]
substrate = "glassy_C"

[run]
histories = 100000
seed = 1
