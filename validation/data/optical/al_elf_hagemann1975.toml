material = "Al"
provenance = "Measured optical constants n, k of Al, far infrared to x-ray (about 1 meV to 120 keV): H.-J. Hagemann, W. Gudat and C. Kunz, J. Opt. Soc. Am. 65, 742 (1975), doi:10.1364/JOSA.65.000742; full tables in DESY report SR-74/7 (1974), Table 2 (PDF pp. 40-42 of the open scan linked from the transcription), seen 2026-10-07; the JOSA paper itself (closed access) was not seen. The authors' joins (report Section 4, pp. 14-15): absorption from Drude parameters to 0.155 eV, interpolated to 0.8 eV, ellipsometry to 2.0 eV, Drude estimate to 13.5 eV, k from angle-resolved reflectance and transmission to 36 eV, their own UHV transmission to 74 eV (fitted at 74 eV), literature transmission to 150 eV and to 300 eV (shape from two sets, scale from a third), Hubbell's compiled cross sections above 300 eV; n then by Kramers-Kronig. Rows read from the transcription Al/nk/Hagemann.yml of the CC0 refractiveindex.info database (https://github.com/polyanskiy/refractiveindex.info-database, commit c5c2f18), fetched 2026-10-07; n, k at 17 energies checked against the scan (secondread_hagemann1975.json). Converted here: E = hc/lambda, ELF = Im[-1/eps] = eps2/(eps1^2+eps2^2) with eps1 = n^2-k^2, eps2 = 2nk. No smoothing, joining or extrapolation by lindhard. Operator ruling #34: committed as cited facts. Issue #98."
