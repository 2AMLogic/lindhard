material = "Au"
provenance = "Measured optical constants n, k of Au, far infrared to x-ray (about 5 meV to 150 keV), composite of the two Au versions of H.-J. Hagemann, W. Gudat and C. Kunz, J. Opt. Soc. Am. 65, 742 (1975), doi:10.1364/JOSA.65.000742; full tables in DESY report SR-74/7 (1974), open scan of 96 PDF pages (SHA-256 f2643a91539506dd6794dde3b4810b91c3c7a24a57f98cf8b8b810e8e0931ed9), seen 2026-10-09; the JOSA paper itself (closed access) was not seen. From 1.5 to 350 eV: Table 6, 'Optical constants of Au from reflectivity-data fitted to Canfield et al. (10)' (PDF pp. 52-54, 124 rows, 1.50 to 350 eV, the whole of that table). Below 1.5 eV and above 350 eV: Table 5 (PDF pp. 49-51), the same 25 rows as au_elf_hagemann1975.toml. The report (p. 18) gives the two tables as alternative versions: Table 5 from fitting the adjacent values to the authors' transmission results, which gives 79 effective electrons; Table 6 from extrapolating the measured reflectance data, which 'reproduces the energy-loss-spectra more closely'. The report prints Table 6 for 1.5 to 350 eV only and does not say how to continue it; the join is lindhard's (issue #314), not the authors': each Table 6 row replaces the Table 5 row at the same energy (the two tables share all 124 energies), and nothing is smoothed, so the ELF steps at both seams: Table 6 / Table 5 = 0.470 at 1.5 eV and 0.229 at 350 eV, and the next Table 5 knot (500 eV) is 2.79 times the Table 6 value at 350 eV. Rows read from the transcriptions Au/nk/Hagemann-2.yml (Table 6) and Au/nk/Hagemann.yml (Table 5) of the CC0 refractiveindex.info database (https://github.com/polyanskiy/refractiveindex.info-database, commit c5c2f18), fetched 2026-10-09; Table 6 n, k at 27 energies from 1.5 to 350 eV checked against the scan (secondread_hagemann1975.json), all equal. Converted here: E = hc/lambda, ELF = Im[-1/eps] = eps2/(eps1^2+eps2^2) with eps1 = n^2-k^2, eps2 = 2nk. No smoothing or extrapolation by lindhard. Operator ruling #34: committed as cited facts. Issue #314."
