material = "Si"
provenance = "Bulk energy-loss function Im[-1/eps] of Si, 0.5 to 199 eV, determined from reflection electron energy loss spectra (REELS) measured at 3, 4 and 5 keV by a reverse Monte Carlo analysis (full Penn algorithm for the bulk term, Ritchie-Howie surface term), averaged over the three primary energies: L. H. Yang, K. Tokesi, J. Toth, B. Da, H. M. Li and Z. J. Ding, Phys. Rev. B 100, 245209 (2019), doi:10.1103/PhysRevB.100.245209, Fig. 7 (red 'Present' curve; linear main panel 0-50 eV, log inset 0-200 eV). Read from the published version deposited at http://real.mtak.hu/105943/1/PhysRevB.100.245209.pdf (SHA-256 99a5f2cc92615f2f483f42e122b810d92c96244b6a3cec6663ddddbe71028648), 2026-10-09. The paper prints no ELF table, so the curve was DIGITIZED by validation/data/digitize/yang2019_si_elf.py: axes from the tick marks, the red stroke's weighted centre per pixel column; knots every 0.25 eV to 24.75 eV (log inset below 3 eV, where the main panel's stroke lies on the axis; main panel from 3 eV), then from the log inset every 1 eV to 199 eV (every 0.25 eV across the L2,3 edge, 96 to 104 eV), joined at 25 eV; values interpolated between column reads, not smoothed. Digitizing uncertainty (half a pixel): about 0.003 in ELF from 3 to 25 eV, about 1.6 % from 25 eV and below 3 eV (more on the steep flanks below 3 eV and at the edge). Second read: the 5 keV curve of Fig. 6(b) of the same paper, digitized the same way at 32 energies (validation/data/digitize/secondread_si_yang2019.json). Caveats: an ELF from the inversion of electron spectra through a dielectric model, not a direct optical measurement; ends at 199 eV, so the Si K shell (about 1.84 keV) and the L-shell tail above 199 eV are absent. Operator ruling #34: committed as cited facts. Issue #125."
