material = "Cu"
provenance = "Measured optical constants n, k of Cu, far infrared to x-ray (about 5 meV to 50 keV): H.-J. Hagemann, W. Gudat and C. Kunz, J. Opt. Soc. Am. 65, 742 (1975), doi:10.1364/JOSA.65.000742; full tables in DESY report SR-74/7 (1974), Table 3 (PDF pp. 43-45 of the open scan linked from the transcription), seen 2026-10-07; the JOSA paper itself (closed access) was not seen. The authors' joins (report Section 4, pp. 15-16): absorption from Drude parameters to 0.5 eV, k from reflectance and transmission to 6.5 eV, an interpolated curve between two reflectance analyses, scaled to one of them, to 13 eV, their own transmission to 150 eV (with an additive correction, report p. 13), literature transmission to 450 eV, Hubbell's compiled cross sections above 450 eV; n then by Kramers-Kronig. The report's 2.00E-03 eV row (no n printed) is not transcribed. Rows read from the transcription Cu/nk/Hagemann.yml of the CC0 refractiveindex.info database (https://github.com/polyanskiy/refractiveindex.info-database, commit c5c2f18), fetched 2026-10-07; n, k at 12 energies checked against the scan (secondread_hagemann1975.json). Converted here: E = hc/lambda, ELF = Im[-1/eps] = eps2/(eps1^2+eps2^2) with eps1 = n^2-k^2, eps2 = 2nk. No smoothing, joining or extrapolation by lindhard. Operator ruling #34: committed as cited facts. Issue #98."
