material = "C"
provenance = "Measured optical constants n, k of glassy carbon, far infrared to x-ray (about 10 meV to 30 keV): H.-J. Hagemann, W. Gudat and C. Kunz, J. Opt. Soc. Am. 65, 742 (1975), doi:10.1364/JOSA.65.000742; full tables in DESY report SR-74/7 (1974), Table 8 (PDF pp. 58-59 of the open scan linked from the transcription), seen 2026-10-08; the JOSA paper itself (closed access) was not seen. The authors' joins (report Section 4, 'Glassy carbon', p. 20): reflectance by Kramers-Kronig analysis to 0.5 eV, k from angle-resolved reflectance on glassy carbon to 80 eV, literature transmission to 700 eV (scaled by 0.75 as a density correction to give 2 effective K electrons), Hubbell's compiled cross sections above 700 eV; n then by Kramers-Kronig. The values are given on the basis of a density of 1.5 g/cm3 (report p. 20). Rows read from the transcription C/nk/Hagemann.yml of the CC0 refractiveindex.info database (https://github.com/polyanskiy/refractiveindex.info-database, commit c5c2f18), fetched 2026-10-08; n, k at 17 energies checked against the scan (secondread_hagemann1975.json). Converted here: E = hc/lambda, ELF = Im[-1/eps] = eps2/(eps1^2+eps2^2) with eps1 = n^2-k^2, eps2 = 2nk. No smoothing, joining or extrapolation by lindhard. Operator ruling #34: committed as cited facts. Issue #148."
