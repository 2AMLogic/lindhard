[package]
name = "lindhard-wasm"
description = "WebAssembly front end for lindhard: a single-thread ion range calculator for the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
# Built with wasm-bindgen into a static page (README.md), never published.
publish = false

[lib]
# `cdylib` is the .wasm module; `rlib` lets the native tests link the same code.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
lindhard = { workspace = true }
wasm-bindgen = "=0.2.129"
serde_json = "1.0.151"
