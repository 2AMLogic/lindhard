# 5 keV boron into amorphous silicon, 7 degrees off normal: the run recorded
# in `b_5keV_si.golden.json` (10^4 ions, seed 1) and compared native-versus-WASM
# by `tests/parity.rs` and `tests/node/parity.test.mjs`. The physics choices
# are the ones the retired one-shot calculator hardcoded in its `input_toml`
# builder (removed with it); they match `examples/b_5keV_si.toml` without the
# `[tally]` section.
#
# Run:   lindhard run lindhard-wasm/tests/b_5keV_si.toml --out out/b_5keV_si
# Check: lindhard check lindhard-wasm/tests/b_5keV_si.toml
#
# Schema: docs/cli.md. Energies are in eV, lengths in nm, angles in degrees.

[beam]
ion = "B"
energy_ev = 5000.0
tilt_deg = 7.0

[target]
# An element symbol names the pure element at its tabulated density
# (lindhard/src/elements.rs).
substrate = "Si"

[physics]
potential = "zbl"
stopping = "lindhard-scharff"
free_path = "constant"
primary_cutoff_ev = 5.0
recoil_cutoff_ev = 2.0

# Si has no default displacement energy in the element table, so the input
# must choose one. 15 eV is an illustrative model parameter, not a
# recommendation: choose E_d for your problem.
[physics.energies.Si]
e_d_ev = 15.0

[run]
ions = 10000
seed = 1
