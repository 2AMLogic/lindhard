# Generated by the lindhard simulator page. Run it unchanged with:
#   lindhard run <this file> --out out/

[beam]
ion = "As"
energy_ev = 50000.0
tilt_deg = 7.0

[materials.SiO2]
density_g_cm3 = 2.2
elements = [
  { symbol = "Si", atom_fraction = 1.0, e_d_ev = 15.0 },
  { symbol = "O", atom_fraction = 2.0, e_d_ev = 20.0, e_s_ev = 2.0 },
]

[materials.Si]
elements = [
  { symbol = "Si", atom_fraction = 1.0, e_d_ev = 15.0 },
]

[target]
substrate = "Si"

[[target.layers]]
material = "SiO2"
thickness_nm = 10.0

[physics]
potential = "zbl"
stopping = "lindhard-scharff"
free_path = "constant"
follow_recoils = true
primary_cutoff_ev = 5.0
recoil_cutoff_ev = 2.0

[run]
ions = 200
seed = 1

[tally]
depth_bin_nm = 1.0
depth_bins = 150
