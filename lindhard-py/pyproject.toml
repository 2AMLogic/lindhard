[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "lindhard"
description = "Python bindings for lindhard: Monte Carlo transport of ions and electrons in matter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
python-source = "python"
module-name = "lindhard._lindhard"
# Build the compiled module for the Python package only; `cargo test` and
# `cargo clippy` on the workspace never link against libpython.
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
