name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean-room:
    name: Clean-room check (no copyleft or SRIM-derived text)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a copyleft notice or a SRIM output header appears
        run: |
          set -euo pipefail
          # Fingerprints of copied files: the GNU license preambles that every
          # GPL/LGPL/AGPL source file carries, and the header lines SRIM writes
          # into its stopping/range tables. CONTRIBUTING.md names these codes
          # in prose but never quotes the fingerprints; .github/ carries them
          # here, so it is excluded.
          if grep -rIl --exclude-dir=.git --exclude-dir=.github --exclude-dir=target \
               -e 'GNU General Public License' -e 'GNU Lesser General Public License' \
               -e 'GNU Affero General Public License' \
               -e 'SRIM version --->' -e 'Calculation using SRIM' . ; then
            echo '::error::copyleft or SRIM-derived text found; this project is clean-room, see CONTRIBUTING.md'
            exit 1
          fi
          echo "clean"

  validation-docs:
    name: Validation tables match the committed results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: docs/validation.md is what validation/update_docs.py generates
        # Python standard library only; reads committed files, runs no simulation.
        run: python3 validation/update_docs.py --check
      - name: docs/benchmarks.md electron tables match the committed summaries
        run: python3 validation/oracles/bench_electron.py --update-docs --check
      - name: validation Python unit tests
        # stdlib unittest only; none needs the built CLI or an oracle binary.
        run: |
          python3 validation/experiments/test_run.py
          python3 validation/experiments/test_se_yield.py
          python3 validation/experiments/test_se_yield_candidates.py
          python3 validation/experiments/test_backscatter.py
          python3 validation/oracles/test_run_electron.py

  figures:
    name: Validation figures match the committed results
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: docs/img figures are what lindhard-plots renders
        # Reads committed results only, runs no simulation. Rendered on macOS
        # aarch64 and checked here on Linux x86_64, so this is also the
        # cross-machine byte-stability check.
        run: cargo run -p lindhard-plots --locked -- --check

  dependency-policy:
    name: Dependency licenses & sources (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # One pin for the whole job: the URL and the checksum both read it.
      CARGO_DENY_VERSION: "0.18.2"
      CARGO_DENY_SHA256: "43c4a79c4b9fd1fcb3dddb305a1b4d8f7ac4a72accd61bb50a0b698789ca894c"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-deny ${{ env.CARGO_DENY_VERSION }}
        run: |
          set -euo pipefail
          tarball="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o /tmp/cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$tarball.tar.gz"
          echo "$CARGO_DENY_SHA256  /tmp/cargo-deny.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/cargo-deny-bin
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp/cargo-deny-bin --strip-components=1 "$tarball/cargo-deny"
          echo /tmp/cargo-deny-bin >> "$GITHUB_PATH"
      - name: cargo deny check licenses sources
        run: cargo deny check licenses sources --show-stats

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  msrv:
    name: MSRV (cargo check at the declared rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from [workspace.package] in Cargo.toml
        id: msrv
        # Single source of truth: changing rust-version in Cargo.toml changes
        # the toolchain tested here, with no other edit.
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[/ { in_pkg = ($0 == "[workspace.package]") }
                                in_pkg && /^rust-version *=/ { print $2; exit }' Cargo.toml)"
          if [ -z "$version" ]; then
            echo '::error::no rust-version under [workspace.package] in Cargo.toml'
            exit 1
          fi
          echo "rust-version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace --all-targets --locked
        # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml (channel = "stable").
        # Separate from the publish --dry-run job, which needs cargo >= 1.90
        # for a publish-time reason unrelated to the MSRV.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          cargo --version
          rustc --version
          cargo check --workspace --all-targets --locked

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  package:
    name: Package (cargo package / publish --dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Review the file list of each crate
        run: |
          set -euo pipefail
          for crate in lindhard lindhard-cli; do
            echo "::group::cargo package --list -p $crate"
            cargo package --list -p "$crate" | tee "/tmp/$crate.list"
            echo "::endgroup::"
            for f in LICENSE CHANGELOG.md README.md Cargo.toml; do
              grep -qx "$f" "/tmp/$crate.list" || { echo "::error::$crate archive lacks $f"; exit 1; }
            done
            if grep -E '^(\.loom|\.github|docs|validation|examples)/' "/tmp/$crate.list"; then
              echo "::error::$crate archive contains files outside the allowlist"; exit 1
            fi
          done
      - name: cargo publish --dry-run (both crates, credential-free, nothing uploaded)
        # --workspace packages and verifies the crates together, resolving
        # lindhard-cli's `lindhard = "0.0.1"` against the freshly packaged
        # library, so it works before the first publication. Needs cargo >= 1.90.
        run: cargo publish --dry-run --workspace

  python:
    name: Python bindings (lindhard-py)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: build the command (the parity tests compare against it)
        run: cargo build -p lindhard-cli
      - name: build the extension and run the tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.7,<2" numpy pytest "mypy>=2,<3"
          cd lindhard-py
          maturin develop
          pytest
      - name: stubs match the compiled extension (stubtest)
        # Naming the package covers both .pyi files; also naming
        # lindhard._lindhard makes mypy report a duplicate module.
        run: |
          . .venv/bin/activate
          cd lindhard-py
          python -m mypy.stubtest lindhard
