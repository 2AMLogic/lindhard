name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Path gate: a prose-only pull request skips the expensive suites.
  #
  # The `changes` job classifies the PR diff into code=true/false; only the
  # `rust` (all three matrix legs) and `python` jobs consult it. Every other
  # job in this file runs unconditionally, on every event.
  #
  # The allowlist's predicate is "no gated check reads this path", NOT "this
  # path is prose". No test or check inside the gated jobs reads any
  # allowlisted path, so skipping the suite on a prose-only diff cannot hide
  # a break. Generated artifacts do not satisfy that predicate, so they are
  # EXCLUDED from the allowlist even where they sit under an allowlisted
  # prefix (the case match below tests the exclusions before the docs/** and
  # book/** prefixes, or the prefixes would swallow them):
  #   docs/img/**                            backscatter.rs reads
  #                                          docs/img/backscatter-eta.svg
  #   book/src/models/stopping-residuals.md  stopping_report.rs reads it
  #   docs/validation.md, docs/benchmarks.md checked by validation-docs
  # A diff touching any of them reports code=true and runs the full suite.
  #
  # Invariants this filter depends on — do not break them silently:
  #   * pull_request-only. The `push: branches: [main]` trigger always runs
  #     every job unfiltered; that run on each merge commit is the payback
  #     that keeps an unedited-path break from going unnoticed for long.
  #   * Fail closed. A gate that errors, is cancelled, or sees an empty or
  #     unreadable diff reports code=true, and `needs.changes.result !=
  #     'success'` in the gated jobs' `if` runs the suite anyway: a check
  #     that cannot run must not look like a check that passed.
  #   * `figures` and `validation-docs` stay unconditional. They run the same
  #     byte-equality checks on the excluded artifacts, so they are the
  #     backstop if an artifact is ever mis-allowlisted. Gating, moving or
  #     narrowing either job voids this filter's safety argument.
  #   * `clean-room` stays unconditional: a copyleft notice can land in a
  #     markdown file as easily as in a .rs one.
  #
  # Standing premise check. If a future change makes a gated test read an
  # allowlisted path, the premise is void and the allowlist must gain another
  # exclusion. Re-run the scan after such changes; it must show no gated test
  # reading an allowlisted path:
  #   git grep -nE 'fs::read|read_to_string|include_str!' origin/main -- '*.rs'
  # ---------------------------------------------------------------------------
  changes:
    name: Diff classification (prose gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: code=true unless every changed path is allowlisted prose
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Any event other than pull_request (the push: [main] run) is
          # never filtered.
          code=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if base="$(git merge-base "origin/$BASE_REF" HEAD)" &&
               list="$(git diff --name-only "$base" HEAD)" &&
               [ -n "$list" ]; then
              code=false
              while IFS= read -r path; do
                case "$path" in
                  docs/img/*|book/src/models/stopping-residuals.md|docs/validation.md|docs/benchmarks.md)
                    code=true
                    break
                    ;;
                  WORK_LOG.md|WORK_PLAN.md|CHANGELOG.md|README.md|CLAUDE.md|AGENTS.md|CONTRIBUTING.md|THIRD_PARTY_LICENSES.md)
                    ;;
                  docs/*|book/*|site/*|.loom/*|.claude/*|.agents/*)
                    ;;
                  *)
                    code=true
                    break
                    ;;
                esac
              done <<< "$list"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  clean-room:
    name: Clean-room check (no copyleft code)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail if a copyleft notice appears
        run: |
          set -euo pipefail
          # Fingerprints of copied code: the GNU license preambles that every
          # GPL/LGPL/AGPL source file carries. CONTRIBUTING.md names these codes
          # in prose but never quotes the fingerprints; .github/ carries them
          # here, so it is excluded. SRIM output is data and is admissible with
          # provenance (operator ruling 2026-11-10, #629), so it is not checked.
          if grep -rIl --exclude-dir=.git --exclude-dir=.github --exclude-dir=target \
               -e 'GNU General Public License' -e 'GNU Lesser General Public License' \
               -e 'GNU Affero General Public License' . ; then
            echo '::error::copyleft notice found; the clean room covers code, see CONTRIBUTING.md'
            exit 1
          fi
          echo "clean"

  validation-docs:
    name: Validation tables match the committed results
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: docs/validation.md is what validation/update_docs.py generates
        # Python standard library only; reads committed files, runs no simulation.
        run: python3 validation/update_docs.py --check
      - name: docs/benchmarks.md electron tables match the committed summaries
        run: python3 validation/oracles/bench_electron.py --update-docs --check
      - name: validation Python unit tests
        # stdlib unittest only; none needs the built CLI or an oracle binary.
        run: |
          python3 validation/experiments/test_run.py
          python3 validation/experiments/test_se_yield.py
          python3 validation/experiments/test_se_yield_candidates.py
          python3 validation/experiments/test_backscatter.py
          python3 validation/oracles/test_run_electron.py
          python3 validation/lib/test_lindhard_cli.py
          python3 validation/lib/test_dataset_checks.py
          python3 validation/lib/test_oracle.py
      - name: Cu-Ni fluence-dependent comparison (#448), reduced statistics
        # Runs the real CLI on Ho row t2-r4 at a sixth of the committed ions
        # (about 10 s after the release build), and checks the committed results
        # against the data files and the fixed tolerances.
        run: python3 validation/experiments/test_cuni_dynamic.py
      - name: Sb-in-Si high-fluence implant comparison (#512), reduced statistics
        # Runs the real CLI at a fifth of the committed ions, one seed, both
        # conventions (about 30 s after the release build), and checks the
        # committed results against the data files and the fixed tolerance.
        run: python3 validation/experiments/test_sb_si_dynamic.py

  workflow-checks:
    name: Workflow checks (clippy pin, canary reporting)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install pyyaml
      - run: python3 .github/scripts/test_clippy_canary.py

  figures:
    name: Validation figures match the committed results
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: docs/img figures are what lindhard-plots renders
        # Reads committed results only, runs no simulation. Rendered on macOS
        # aarch64 and checked here on Linux x86_64, so this is also the
        # cross-machine byte-stability check.
        run: cargo run -p lindhard-plots --locked -- --check
      - name: book/src/models/stopping-residuals.md is what lindhard-stopping-report renders
        # Reads the committed stopping datasets only; same check as the figures.
        run: cargo run -p lindhard-plots --locked --bin lindhard-stopping-report -- --check

  dependency-policy:
    name: Dependency licenses & sources (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # One pin for the whole job: the URL and the checksum both read it.
      CARGO_DENY_VERSION: "0.18.2"
      CARGO_DENY_SHA256: "43c4a79c4b9fd1fcb3dddb305a1b4d8f7ac4a72accd61bb50a0b698789ca894c"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-deny ${{ env.CARGO_DENY_VERSION }}
        run: |
          set -euo pipefail
          tarball="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o /tmp/cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$tarball.tar.gz"
          echo "$CARGO_DENY_SHA256  /tmp/cargo-deny.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/cargo-deny-bin
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp/cargo-deny-bin --strip-components=1 "$tarball/cargo-deny"
          echo /tmp/cargo-deny-bin >> "$GITHUB_PATH"
      - name: cargo deny check licenses sources
        run: cargo deny check licenses sources --show-stats

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    # Fail closed: run unless this is a pull_request the gate classified as
    # prose-only — and run whenever the gate did not succeed, provided the
    # run itself was not cancelled (a cancelled run is no verdict; a gate
    # that died on its own timeout still dispatches this job, measured in
    # #841). See the comment block above the `changes` job for the
    # invariants.
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.code == 'true'
      )
    runs-on: ${{ matrix.os }}
    # The slowest green leg takes ~27 min (macOS ~26 min, of which the test
    # step is ~24 min), so 30 min cancels on small growth. 45 min leaves
    # headroom while a hung run still stops.
    timeout-minutes: 45
    env:
      # Exact Rust release for the required clippy gate (rustc 1.99.0,
      # released 2026-10-01). Bump deliberately; see CONTRIBUTING.md.
      CLIPPY_TOOLCHAIN: "1.99.0"
    strategy:
      fail-fast: false
      matrix:
        # x86_64 Linux is pinned to 24.04: ubuntu-latest moved to 26.04, where
        # linking lindhard-py fails with "unable to find library -lpython3.12".
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install the pinned clippy toolchain
        # The required clippy gate runs on an exact release so that a new Rust
        # stable cannot change the lint set under unrelated pull requests.
        # Latest-stable and beta drift is reported by clippy-canary.yml.
        # Bump procedure: CONTRIBUTING.md, "Clippy pin and canary".
        run: rustup toolchain install "$CLIPPY_TOOLCHAIN" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (pinned toolchain)
        run: cargo +"$CLIPPY_TOOLCHAIN" clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  msrv:
    name: MSRV (cargo check at the declared rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from [workspace.package] in Cargo.toml
        id: msrv
        # Single source of truth: changing rust-version in Cargo.toml changes
        # the toolchain tested here, with no other edit.
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[/ { in_pkg = ($0 == "[workspace.package]") }
                                in_pkg && /^rust-version *=/ { print $2; exit }' Cargo.toml)"
          if [ -z "$version" ]; then
            echo '::error::no rust-version under [workspace.package] in Cargo.toml'
            exit 1
          fi
          echo "rust-version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace --all-targets --locked
        # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml (channel = "stable").
        # Separate from the publish --dry-run job, which needs cargo >= 1.90
        # for a publish-time reason unrelated to the MSRV.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          cargo --version
          rustc --version
          cargo check --workspace --all-targets --locked

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  package:
    name: Package (cargo package / publish --dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Review the file list of each crate
        run: |
          set -euo pipefail
          for crate in lindhard lindhard-cli; do
            echo "::group::cargo package --list -p $crate"
            cargo package --list -p "$crate" | tee "/tmp/$crate.list"
            echo "::endgroup::"
            for f in LICENSE CHANGELOG.md README.md Cargo.toml; do
              grep -qx "$f" "/tmp/$crate.list" || { echo "::error::$crate archive lacks $f"; exit 1; }
            done
            if grep -E '^(\.loom|\.github|docs|validation|examples)/' "/tmp/$crate.list"; then
              echo "::error::$crate archive contains files outside the allowlist"; exit 1
            fi
          done
      - name: cargo publish --dry-run (both crates, credential-free, nothing uploaded)
        # --workspace packages and verifies the crates together, resolving
        # lindhard-cli's `lindhard = "0.0.1"` against the freshly packaged
        # library, so it works before the first publication. Needs cargo >= 1.90.
        run: cargo publish --dry-run --workspace

  python:
    name: Python bindings (lindhard-py)
    needs: changes
    # Same fail-closed gate as the `rust` job: runs whenever the gate did
    # not succeed and the run itself was not cancelled.
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.code == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: build the command (the parity tests compare against it)
        run: cargo build -p lindhard-cli
      - name: build the extension and run the tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.7,<2" numpy pytest "mypy>=2,<3"
          cd lindhard-py
          maturin develop
          pytest
      - name: stubs match the compiled extension (stubtest)
        # Naming the package covers both .pyi files; also naming
        # lindhard._lindhard makes mypy report a duplicate module.
        run: |
          . .venv/bin/activate
          cd lindhard-py
          python -m mypy.stubtest lindhard
