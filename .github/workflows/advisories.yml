name: Dependency advisories

# Weekly RustSec advisory report, never gating. The RustSec database changes
# without any commit here, so a PR-time check would fail unrelated PRs on a
# newly published advisory; ci.yml therefore runs only `licenses sources`. A
# failure here is reported through one marker-identified tracking issue. Not a
# pull_request workflow and not referenced by ci.yml. See CONTRIBUTING.md,
# "Dependency advisories".

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      simulate-failure:
        description: "Force the check red to exercise issue reporting (never set by schedule)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  advisories:
    name: cargo deny check advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Deliberately newer than the 0.18.2 pin in ci.yml's dependency-policy
      # job. 0.18.2 cannot load the current RustSec database (it fails with
      # "unsupported CVSS version: 4.0"), so it cannot run this check at all.
      # 0.20.2 parses the same deny.toml; 0.18.2 still parses it for the PR job.
      # Bump the two pins independently; the checksum is of the release tarball.
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-deny ${{ env.CARGO_DENY_VERSION }}
        run: |
          set -euo pipefail
          tarball="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o /tmp/cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$tarball.tar.gz"
          echo "$CARGO_DENY_SHA256  /tmp/cargo-deny.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/cargo-deny-bin
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp/cargo-deny-bin --strip-components=1 "$tarball/cargo-deny"
          echo /tmp/cargo-deny-bin >> "$GITHUB_PATH"
      - name: cargo deny check advisories
        run: cargo deny check advisories --show-stats
      - name: Simulated failure (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate-failure }}
        run: |
          echo "::error::simulated advisories failure requested by the simulate-failure input"
          exit 1
      # A failed database fetch fails the check step above, so it is recorded
      # as a failure here, never as success.
      - name: Record the result for the reporter
        if: always()
        run: |
          mkdir -p result
          echo "${{ job.status }}" > result/advisories.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: result-advisories
          path: result/advisories.txt

  report:
    name: Report to the tracking issue
    needs: advisories
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Create, comment on, reopen or close the canonical issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULTS_DIR: results
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/advisories_report.py
