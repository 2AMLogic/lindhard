# 5 keV boron into silicon through a patterned SiO2 hard mask: a masked
# region over a substrate, described with [[target.solids]] instead of the
# laterally uniform [[target.layers]].
#
# Run:   lindhard run examples/b_5keV_si_masked.toml --out out/b_5keV_si_masked
# Check: lindhard check examples/b_5keV_si_masked.toml
#
# Schema: docs/cli.md ([[target.solids]]). Energies are in eV, lengths in
# nm, angles in degrees. The E_d and E_s values for O are illustrative model
# parameters, not recommendations.

[beam]
ion = "B"
energy_ev = 5000.0
tilt_deg = 7.0

# 2.2 g/cm^3 is the usual handbook density of vitreous (amorphous) silica.
[materials.SiO2]
density_g_cm3 = 2.2
elements = [
  { symbol = "Si", atom_fraction = 1.0 },
  { symbol = "O", atom_fraction = 2.0, e_d_ev = 20.0, e_s_ev = 2.0 },
]

# Listing order is priority order: where solids overlap, the first listed
# owns the space, so the 40 nm oxide mask listed first cuts into the silicon
# block behind it. The mask covers the +y half of the surface; the ion
# enters at the centre of the scene's front face, (0, 0, 0) nm, right at the
# mask edge, so the depth profile mixes masked and bare silicon.
[[target.solids]]
shape = "cuboid"
material = "SiO2"
lo_nm = [0.0, 0.0, -500.0]
hi_nm = [40.0, 500.0, 500.0]

[[target.solids]]
shape = "cuboid"
material = "Si"
lo_nm = [0.0, -500.0, -500.0]
hi_nm = [500.0, 500.0, 500.0]

[physics]
potential = "zbl"
stopping = "lindhard-scharff"
free_path = "constant"
primary_cutoff_ev = 5.0
recoil_cutoff_ev = 2.0

# Applies to Si in the mask and in the block (illustrative value).
[physics.energies.Si]
e_d_ev = 15.0

[run]
ions = 2000
seed = 1

[tally]
depth_bin_nm = 1.0
depth_bins = 150
