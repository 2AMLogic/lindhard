[package]
name = "lindhard-plots"
description = "Renders the committed validation figures in docs/img from committed results (not published)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# A docs-generation tool for this repository only. It is never published, so
# its plotting dependency stays out of every crate users install.
publish = false

[[bin]]
name = "lindhard-plots"
path = "src/main.rs"
doc = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
# Pinned exactly: rizzma is a young crate with near-daily patch releases, and
# its declared rust-version has moved between patch releases before (1.13.0
# declared 1.96, 1.13.1 to 1.13.7 declare 1.85). An exact pin means a bump is
# a deliberate lockfile change that must pass the MSRV job and re-render the
# committed figures byte for byte. Default features (wasm, show, plot3d,
# pyplot, portable) are off: only the core figure code and the SVG backend
# are used.
rizzma = { version = "=1.13.7", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
